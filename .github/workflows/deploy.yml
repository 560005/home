name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [ deploy ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Babashka
        env:
          BABASHKA_VERSION: 1.12.208
        run: |
          curl -sLO https://github.com/babashka/babashka/releases/download/v${{ env.BABASHKA_VERSION }}/babashka-${{ env.BABASHKA_VERSION }}-linux-amd64.tar.gz
          sudo tar -xzf babashka-${{ env.BABASHKA_VERSION }}-linux-amd64.tar.gz -C /usr/local/bin --strip-components=0
          rm -f babashka-${{ env.BABASHKA_VERSION }}-linux-amd64.tar.gz

      - name: Generate site content
        run: bb bin/generate-site

      - name: Verify content generated
        run: test -d content/c && find content -name '*.md' | head -20

      - name: Install Zola
        env:
          ZOLA_VERSION: 0.21.0
        run: |
          curl -sLO https://github.com/getzola/zola/releases/download/v${{ env.ZOLA_VERSION }}/zola-v${{ env.ZOLA_VERSION }}-x86_64-unknown-linux-musl.tar.gz
          sudo tar -xzf zola-v${{ env.ZOLA_VERSION }}-x86_64-unknown-linux-musl.tar.gz -C /usr/local/bin
          rm -f zola-v${{ env.ZOLA_VERSION }}-x86_64-unknown-linux-musl.tar.gz

      - name: Build site
        run: zola build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=560005-town --branch=main
