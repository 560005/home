<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page.title | default(value="560005.town") }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ page.description | default(value="Community directory for around North Bangalore") }}{% endblock %}">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="{{ get_url(path="style.css", cachebust=true) }}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav aria-label="Site navigation">
                <a href="/" class="site-title">560005.town</a>
                <div class="nav-links">
                    <a href="mailto:mail@kitallis.in?subject=New listing for 560005.town">Request a listing</a>
                </div>
            </nav>
            <div data-search class="search-wrapper">
                <label for="search-input" class="sr-only">Search listings</label>
                <input type="search" data-search-input placeholder="Search listings..." autocomplete="off">
                <div data-search-results role="listbox" aria-label="Search results" hidden></div>
            </div>
        </div>
    </header>

    <template data-search-result-template>
        <a class="search-result" role="option">
            <strong data-field="title"></strong>
            <span data-field="snippet"></span>
        </a>
    </template>

    <template data-search-empty-template>
        <div class="search-result">No results found.</div>
    </template>

    <main class="container">
        {% block content %}
        {{ page.content | safe }}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <span>560005.town · last updated on {{ now() | date(format="%b %d, %Y") }}</span>
        <a href="/about/">about</a>
    </footer>

    <script>
    class SearchComponent {
      constructor(selector, {
        inputSelector,
        resultsSelector,
        resultTemplate,
        emptyTemplate,
        resultItemSelector,
        activeClass,
        elasticlunrUrl,
        searchIndexUrl,
        minQueryLength = 2,
        maxResults = 10,
        snippetLength = 120,
        scoreThreshold = 0.5,
        renderResult = null,
      }) {
        this.container = document.querySelector(selector);
        if (!this.container) return;

        this.input = this.container.querySelector(inputSelector);
        this.results = this.container.querySelector(resultsSelector);
        this.resultTpl = document.querySelector(resultTemplate);
        this.emptyTpl = document.querySelector(emptyTemplate);
        this.resultItemSelector = resultItemSelector;
        this.activeClass = activeClass || "active";

        this.elasticlunrUrl = elasticlunrUrl;
        this.searchIndexUrl = searchIndexUrl;
        this.minQueryLength = minQueryLength;
        this.maxResults = maxResults;
        this.snippetLength = snippetLength;
        this.scoreThreshold = scoreThreshold;
        this.renderResult = renderResult || this.defaultRenderResult.bind(this);

        this.index = null;
        this.loaded = false;
        this.active = -1;

        this.input.addEventListener("focus", () => this.loadIndex());
        this.input.addEventListener("input", () => { this.active = -1; this.search(); });
        this.input.addEventListener("keydown", (e) => this.handleKeydown(e));
        document.addEventListener("click", (e) => {
          if (!this.container.contains(e.target)) this.clear();
        });

        // Warm the index in the background once the page is idle after first
        // paint, so search is ready before the user interacts. focus remains a
        // fallback trigger, and loadIndex() is idempotent.
        const warm = () => this.loadIndex();
        const schedule = () => (window.requestIdleCallback || window.setTimeout)(warm);
        if (document.readyState === "complete") schedule();
        else window.addEventListener("load", schedule);
      }

      loadIndex() {
        if (this.loaded) return;
        this.loaded = true;

        const s1 = document.createElement("script");
        s1.src = this.elasticlunrUrl;
        s1.onload = () => {
          const s2 = document.createElement("script");
          s2.src = this.searchIndexUrl;
          s2.onload = () => {
            if (window.searchIndex) this.index = elasticlunr.Index.load(window.searchIndex);
            // If the user already typed while the index was loading, run it now.
            if (this.input.value.trim()) this.search();
          };
          document.body.appendChild(s2);
        };
        document.body.appendChild(s1);
      }

      search() {
        const query = this.input.value.trim();
        if (!this.index || query.length < this.minQueryLength) { this.clear(); return; }

        const hits = this.index.search(query, { expand: false, bool: "AND" })
          .filter(hit => hit.score > this.scoreThreshold);

        this.clearResults();

        if (hits.length === 0) {
          this.results.appendChild(this.emptyTpl.content.cloneNode(true));
        } else {
          hits.slice(0, this.maxResults).forEach(hit => {
            const doc = this.index.documentStore.getDoc(hit.ref);
            const node = this.renderResult(this.resultTpl, doc, hit);
            this.results.appendChild(node);
          });
        }
        this.show();
      }

      defaultRenderResult(tpl, doc, hit) {
        const node = tpl.content.cloneNode(true);
        const link = node.querySelector("a");
        link.href = hit.ref.replace(/^https?:\/\/[^\/]+/, "");
        node.querySelector("[data-field='title']").textContent = doc.title || hit.ref;
        node.querySelector("[data-field='snippet']").textContent =
          (doc.body || "").substring(0, this.snippetLength).replace(/\n/g, " ") + "...";
        return node;
      }

      handleKeydown(e) {
        const items = this.items();
        if (!items.length) return;

        switch (e.key) {
          case "ArrowDown": e.preventDefault(); this.setActive(this.active + 1); break;
          case "ArrowUp":   e.preventDefault(); this.setActive(this.active - 1); break;
          case "Enter":     if (this.active >= 0) { e.preventDefault(); items[this.active].click(); } break;
          case "Escape":    this.clear(); break;
        }
      }

      setActive(i) {
        const items = this.items();
        if (!items.length) return;
        items.forEach(el => el.classList.remove(this.activeClass));
        this.active = i >= items.length ? 0 : i < 0 ? items.length - 1 : i;
        items[this.active].classList.add(this.activeClass);
        items[this.active].scrollIntoView({ block: "nearest" });
      }

      items() { return this.results.querySelectorAll(this.resultItemSelector); }
      show() { this.results.hidden = false; }

      clear() {
        this.clearResults();
        this.results.hidden = true;
        this.active = -1;
      }

      clearResults() {
        while (this.results.firstChild) this.results.removeChild(this.results.firstChild);
      }
    }

    new SearchComponent("[data-search]", {
      inputSelector:      "[data-search-input]",
      resultsSelector:    "[data-search-results]",
      resultTemplate:     "[data-search-result-template]",
      emptyTemplate:      "[data-search-empty-template]",
      resultItemSelector: ".search-result",
      activeClass:        "active",
      elasticlunrUrl:     "{{ get_url(path='elasticlunr.min.js') }}",
      searchIndexUrl:     "{{ get_url(path='search_index.en.js') }}",
    });
    </script>
</body>
</html>
