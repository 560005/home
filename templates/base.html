<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page.title | default(value="560005.town") }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ page.description | default(value="Community directory for around North Bangalore") }}{% endblock %}">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="{{ get_url(path="style.css", cachebust=true) | replace(from=config.base_url, to="") | safe }}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav aria-label="Site navigation">
                <a href="/" class="site-title">560005.town</a>
                <div class="nav-links">
                    <a href="#" data-u="mail" data-d="kitallis.in" data-subject="New listing for 560005.town">Request a listing</a>
                </div>
            </nav>
            <div data-search class="search-wrapper" data-index-url="/search.json?v={{ now() | date(format='%s') }}">
                <label for="search-input" class="sr-only">Search listings</label>
                <input type="search" id="search-input" name="q" data-search-input placeholder="Search listings, e.g. dentist, plumber, tailor" autocomplete="off">
                <span class="search-hint search-hint-slash" aria-hidden="true"><kbd>/</kbd></span>
                <span class="search-hint search-hint-arrows" aria-hidden="true">
                    <kbd class="search-hint-sideways"><svg viewBox="0 0 10 16" fill="currentColor"><path d="M8.766.566A2 2 0 0 0 6.586 1L1 6.586a2 2 0 0 0 0 2.828L6.586 15A2 2 0 0 0 10 13.586V2.414A2 2 0 0 0 8.766.566Z"/></svg></kbd>
                    <kbd class="search-hint-sideways"><svg viewBox="0 0 10 16" fill="currentColor"><path d="M3.414 1A2 2 0 0 0 0 2.414v11.172A2 2 0 0 0 3.414 15L9 9.414a2 2 0 0 0 0-2.828L3.414 1Z"/></svg></kbd>
                    <kbd><svg viewBox="0 0 16 10" fill="currentColor"><path d="M15.434 1.235A2 2 0 0 0 13.586 0H2.414A2 2 0 0 0 1 3.414L6.586 9a2 2 0 0 0 2.828 0L15 3.414a2 2 0 0 0 .434-2.179Z"/></svg></kbd>
                </span>
                <div data-search-results role="listbox" aria-label="Search results" hidden></div>
            </div>
        </div>
    </header>

    <main class="container">
        {% block content %}
        {{ page.content | safe }}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <span>560005.town · last updated on {{ now() | date(format="%b %d, %Y") }}</span>
        <a href="/about/">about</a>
    </footer>

    <script src="{{ get_url(path='minisearch.min.js') | replace(from=config.base_url, to='') | safe }}" defer></script>
    <script src="{{ get_url(path='search.js', cachebust=true) | replace(from=config.base_url, to='') | safe }}" defer></script>
    <script>
    // Assemble mailto links from data-* parts so addresses never appear in the
    // raw HTML (basic scraper obfuscation, no external request). Keeps existing
    // link text; fills in the address where the link has none (e.g. /about).
    document.querySelectorAll("a[data-u][data-d]").forEach((a) => {
      const addr = a.dataset.u + "@" + a.dataset.d;
      const subject = a.dataset.subject ? "?subject=" + encodeURIComponent(a.dataset.subject) : "";
      a.href = "mailto:" + addr + subject;
      if (!a.textContent.trim()) a.textContent = addr;
    });
    </script>
</body>
</html>
