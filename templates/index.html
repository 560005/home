{% extends "base.html" %} {% block content %}
<div class="index-grid">
  <div>
    <h2>Categories</h2>
    <ul>
    {% for cat in section.extra.categories %}
      <li><a href="/c/{{ cat.slug }}/">{{ cat.name }}</a> <span class="text-gray text-xs">({{ cat.count }})</span></li>
    {% endfor %}
    </ul>
  </div>
  <div>
    <h2>Tags</h2>
    <div>
    {% for tag in section.extra.tags %}
      <a href="/t/{{ tag.slug }}/" class="tag">{{ tag.name }}</a>
    {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
